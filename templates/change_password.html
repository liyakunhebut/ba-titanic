{% extends "base.html" %}
{% block title %}修改密码 · 在线评分系统{% endblock %}
{% block content %}
<div class="card narrow">
    <h2 class="card-title">修改密码</h2>
    <p class="card-desc">当前账号：{{ user.student_no }} ｜ {{ user.name }}（{{ user.class_name }}）</p>

    <form method="post" class="form">
        <label class="field">
            <span class="field-label">原密码</span>
            <input type="password" name="old_password" required autofocus autocomplete="current-password">
        </label>
        <label class="field">
            <span class="field-label">新密码</span>
            <input type="password" name="new_password" required minlength="6"
                   placeholder="至少 6 位" autocomplete="new-password">
        </label>
        <label class="field">
            <span class="field-label">确认新密码</span>
            <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
        </label>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">确认修改</button>
            <a href="{{ url_for('upload_page') }}" class="btn btn-ghost">取消</a>
        </div>
    </form>
</div>
{% endblock %}
