{% extends "base.html" %}
{% block title %}登录 · 商务大数据课程竞赛在线评分系统{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <span class="login-logo-svg" aria-hidden="true">
            <svg viewBox="0 0 120 120" width="88" height="88" role="img">
                <rect x="12" y="12" width="96" height="96" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
                <rect x="35" y="62" width="11" height="20" rx="2.5" fill="#2563eb"/>
                <rect x="54.5" y="48" width="11" height="34" rx="2.5" fill="#2563eb"/>
                <rect x="74" y="36" width="11" height="46" rx="2.5" fill="#2563eb"/>
                <polyline points="33,58 53,48 73,38" fill="none" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M80 30 L88 26 L84 34" fill="none" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        <h1 class="login-title">商务大数据课程竞赛</h1>
        <div class="login-sub-badge">在线评分系统</div>

        <form method="post" class="form">
            <label class="field">
                <span class="field-label">学号</span>
                <input type="text" name="student_no" required autofocus
                       placeholder="请输入学号" autocomplete="username">
            </label>
            <label class="field">
                <span class="field-label">密码</span>
                <input type="password" name="password" required
                       placeholder="初始密码为学号" autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn-primary btn-block">登 录</button>
        </form>

        <p class="login-tip">首次登录账号与密码均为<b>学号</b>，登录后可在「修改密码」中更换。</p>
    </div>
</div>
{% endblock %}
